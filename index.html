<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ciclo de Vida de la Planta | Aula Visual Interactiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Estilos personalizados para animaciones y accesibilidad */
    body {
      font-family: 'Quicksand', 'Comic Sans MS', 'Montserrat', sans-serif;
      background: linear-gradient(145deg, #fef9e3 0%, #f0f7e8 100%);
      -webkit-tap-highlight-color: transparent;
    }

    /* Tarjetas interactivas de etapas */
    .stage-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      background: rgba(255, 255, 245, 0.92);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
    }
    .stage-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 28px rgba(0, 0, 0, 0.15);
    }

    /* Feedback visual (pulsaciones y aciertos) */
    .visual-feedback {
      animation: pulseSoft 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }
    @keyframes pulseSoft {
      0% { box-shadow: 0 0 0 0 #c8ffb0, border-color: #9bff9b; background: #ffffe0; }
      50% { box-shadow: 0 0 0 14px rgba(120, 200, 80, 0.4); background: #e6ffcc; }
      100% { box-shadow: 0 0 0 0 rgba(120, 200, 80, 0); background: rgba(255, 255, 245, 0.92); }
    }

    /* Estilo para el juego Drag & Drop (macetas) */
    .drag-pot {
      background: #fdf8ed;
      border-radius: 1.5rem;
      padding: 0.75rem;
      box-shadow: 0 8px 0 #b97f3a;
      cursor: grab;
      transition: all 0.2s;
      border: 2px solid #d49b5f;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 135px;
      user-select: none;
      touch-action: none;
    }
    .drag-pot:active { cursor: grabbing; }
    .drag-pot.dragging { opacity: 0.5; }
    
    /* Efecto de selección para pantallas móviles */
    .drag-pot.mobile-selected {
      border-color: #2e7d32;
      background: #e8f5e9;
      box-shadow: 0 8px 0 #2e7d32;
      transform: scale(1.05);
      animation: pulseSelection 1s infinite alternate;
    }
    @keyframes pulseSelection {
      0% { box-shadow: 0 8px 0 #2e7d32, 0 0 4px #4caf50; }
      100% { box-shadow: 0 8px 0 #2e7d32, 0 0 15px #4caf50; }
    }

    .drop-slot {
      background: #f0e7cf;
      border: 3px dashed #8b6946;
      border-radius: 1.8rem;
      transition: all 0.15s;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .drop-slot.drag-over {
      background: #e3d4b5;
      border: 3px solid #5a3e1f;
      transform: scale(1.02);
    }
    
    /* Indicador visual de destino cuando hay un elemento seleccionado en móvil */
    .drop-slot.waiting-touch {
      border-color: #4caf50;
      background: #f1f8e9;
    }
    
    .slot-filled {
      background: #cfe6c1;
      border: 2px solid #2e7d32;
      box-shadow: 0 0 0 3px #b9f6b0;
    }

    /* Tooltip visual para palabras clave */
    .vocab-word {
      display: inline-block;
      background: #fff0b5;
      border-radius: 40px;
      padding: 0 10px;
      font-weight: 700;
      border-bottom: 3px solid #ffb347;
      cursor: pointer;
      transition: 0.1s;
    }
    .vocab-word:hover {
      background: #ffe48f;
      transform: scale(1.02);
    }
    .vocab-tooltip {
      position: absolute;
      background: #ffffffdd;
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 10px 18px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.2);
      border-left: 8px solid #6fbf4c;
      font-weight: 500;
      z-index: 200;
      pointer-events: none;
      font-size: 0.9rem;
      max-width: 220px;
      text-align: center;
    }

    /* Animaciones para el SVG de la maceta central */
    .pot-svg-container svg {
      filter: drop-shadow(2px 6px 10px rgba(0,0,0,0.15));
    }

    /* Confeti animado */
    .confetti-particle {
      position: fixed;
      pointer-events: none;
      z-index: 1000;
    }
    button, .stage-card, .drag-pot, .drop-slot {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="p-3 md:p-6">

<div class="max-w-7xl mx-auto">
  <div class="text-center mb-6">
    <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-green-700 to-amber-700 inline-block px-4 py-2 rounded-full bg-white/60 shadow-md whitespace-normal break-words max-w-full">
      🌱 Ciclo de Vida de la Planta 🌻
    </h1>
    <p class="text-lg md:text-xl text-stone-700 mt-3 font-semibold">¡Explora dentro de la <span class="vocab-word" data-vocab="maceta">maceta</span> y ordena el ciclo!</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8 md:mb-12">
