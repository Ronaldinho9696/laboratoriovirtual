<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🌱 Partes de la Planta | UCV - Educación Primaria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #b9e0c5 0%, #8fc0a9 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            max-width: 1300px;
            width: 100%;
            background: #fffff5;
            border-radius: 75px 75px 65px 65px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.2);
            padding: 20px 25px 35px;
            text-align: center;
        }

        /* ENCABEZADO UCV */
        .header-ucv {
            background: linear-gradient(135deg, #1a3a5c, #2a5f7a);
            border-radius: 50px 50px 30px 30px;
            padding: 12px 25px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 6px 0 #0e2a42;
        }

        .header-ucv .logo-ucv {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffd966;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #0e2a42;
        }

        .header-ucv .facultad {
            color: #c8e6ff;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255,255,255,0.15);
            padding: 5px 18px;
            border-radius: 30px;
            border: 2px solid #ffd966;
        }

        .header-ucv .facultad span {
            color: #ffd966;
        }

        h1 {
            font-size: 2.3rem;
            background: #ffbf69;
            display: inline-block;
            padding: 8px 35px;
            border-radius: 60px;
            color: #2c4b2f;
            box-shadow: 0 7px 0 #c16f2e;
            margin: 5px 0 8px;
        }

        .subtitulo {
            font-size: 1.2rem;
            background: #e2f0da;
            width: fit-content;
            margin: 5px auto 18px;
            padding: 6px 28px;
            border-radius: 40px;
            color: #2d6a4f;
            font-weight: bold;
        }

        /* LAYOUT: contenedor con flex para poner info al costado */
        .contenedor-principal {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin: 10px 0 15px;
        }

        /* Columna izquierda: planta */
        .columna-planta {
            flex: 2;
            min-width: 0;
        }

        /* Columna derecha: recuadro informativo (al costado) */
        .columna-info {
            flex: 1;
            min-width: 250px;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .planta-mural {
            background: #f9e7c2;
            background-image: radial-gradient(circle at 20% 35%, rgba(120, 70, 30, 0.08) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 85px 85px 65px 65px;
            padding: 20px 15px 20px;
            position: relative;
            border: 5px solid #d9a76b;
            box-shadow: inset 0 0 0 5px #fff0cc, 0 12px 22px rgba(0, 0, 0, 0.2);
            cursor: default;
        }

        .svg-plant-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        svg {
            width: 100%;
            max-width: 750px;
            height: auto;
            filter: drop-shadow(6px 10px 12px rgba(0,0,0,0.2));
            display: block;
            margin: 0 auto;
        }

        .parte-planta {
            cursor: pointer;
            transition: filter 0.15s;
        }

        .parte-planta:hover {
            filter: brightness(1.08) drop-shadow(0 0 6px rgba(255, 215, 0, 0.4));
        }

        .highlight-part {
            filter: drop-shadow(0 0 16px #ffdd77) brightness(1.2);
            transition: 0.1s;
        }

        /* PANEL DE RESPUESTA (nombre + función) */
        .respuesta-panel {
            background: linear-gradient(135deg, #ffd6a5, #fdffb6, #caffbf, #9bf6ff, #a0c4ff, #ffc6ff);
            border-radius: 70px;
            padding: 15px 20px;
            margin: 10px 0;
            border: 5px solid white;
            box-shadow: 0 8px 0 #bba88a;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .parte-gigante {
            font-size: 2.8rem;
            font-weight: bold;
            background: #2c5e2a;
            color: white;
            padding: 10px 28px;
            border-radius: 80px;
            display: inline-block;
            letter-spacing: 3px;
            box-shadow: 0 5px 0 #1a3a18;
            text-shadow: 2px 2px 0 #1a3a18;
        }

        .funcion-texto {
            background: white;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: bold;
            max-width: 400px;
            color: #1f3d2c;
        }

        .emoji-grande {
            font-size: 3rem;
            background: white;
            border-radius: 100px;
            width: 75px;
            height: 75px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* RECUADRO INFORMATIVO - AHORA AL COSTADO (columna derecha) */
        .info-box {
            background: white;
            border-radius: 30px;
            padding: 18px 22px;
            border: 4px solid #2c5e2a;
            box-shadow: 0 6px 0 #1a3a18;
            display: none;
            text-align: left;
            transition: all 0.3s;
            width: 100%;
        }

        .info-box.mostrar {
            display: block;
            animation: aparecerInfo 0.4s ease-out;
        }

        @keyframes aparecerInfo {
            0% { opacity: 0; transform: translateX(-20px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        .info-box .titulo-info {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2c5e2a;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-box .titulo-info .icono-info {
            font-size: 1.8rem;
        }

        .info-box .pregunta {
            font-size: 1.1rem;
            font-weight: bold;
            color: #1a3a5c;
            margin: 8px 0 4px;
        }

        .info-box .respuesta {
            font-size: 1rem;
            color: #333;
            padding-left: 15px;
            margin-bottom: 8px;
            border-left: 4px solid #ffbf69;
            padding-left: 15px;
        }

        .info-box .respuesta:last-child {
            margin-bottom: 0;
        }

        .info-box .utilidad {
            background: #e2f0da;
            padding: 10px 15px;
            border-radius: 20px;
            margin-top: 8px;
            font-size: 1rem;
            color: #1f4d2a;
        }

        .info-box .utilidad strong {
            color: #2c5e2a;
        }

        /* Barra de progreso */
        .progress-area {
            margin: 15px 0 10px;
        }
        .progress-header {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .progress-bg {
            background-color: #e2d8bf;
            border-radius: 40px;
            height: 24px;
            width: 100%;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #40916c;
            border-radius: 40px;
            transition: width 0.45s ease-out;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 12px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .water-button {
            background: #6fbf4c;
            border: none;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 80px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 0 #2c6e2f;
            transition: 0.07s linear;
            margin: 8px 0 5px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
        }
        .water-button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #2c6e2f;
        }

        /* ANIMACIONES */
        @keyframes gotasSuben {
            0% { transform: translateY(0px) scale(0.6); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.1); opacity: 0; }
        }
        .drop-animation {
            position: absolute;
            font-size: 1.7rem;
            pointer-events: none;
            z-index: 200;
            animation: gotasSuben 0.85s ease-out forwards;
        }

        @keyframes brillarTallo {
            0% { filter: drop-shadow(0 0 0px #ffe69b); }
            50% { filter: drop-shadow(0 0 18px #ffbc3c) brightness(1.25); }
            100% { filter: drop-shadow(0 0 0px #ffe69b); }
        }
        .tallo-glint {
            animation: brillarTallo 0.5s ease 2;
        }

        @keyframes solAnim {
            0% { transform: scale(0.7); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .sun-flash {
            position: absolute;
            font-size: 3.2rem;
            top: 8%;
            right: 12%;
            animation: solAnim 0.8s forwards;
            pointer-events: none;
            z-index: 150;
        }

        @keyframes sacudirHojas {
            0% { transform: rotate(0deg); }
            30% { transform: rotate(7deg); }
            70% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        .hoja-wobble {
            animation: sacudirHojas 0.45s ease-in-out 2;
            transform-origin: center;
        }

        @keyframes florecerZoom {
            0% { transform: scale(1); }
            60% { transform: scale(1.2) rotate(2deg); }
            100% { transform: scale(1); }
        }
        .flor-bloom {
            animation: florecerZoom 0.45s cubic-bezier(0.2, 1.2, 0.8, 1) 2;
        }

        @keyframes abejaVuela {
            0% { transform: translate(0px, 0px) scale(0.5); opacity: 0; }
            20% { transform: translate(15px, -15px) scale(1); opacity: 1; }
            80% { transform: translate(-10px, -40px) scale(1); opacity: 1; }
            100% { transform: translate(30px, -75px) scale(0.6); opacity: 0; }
        }
        .bee-fly {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 180;
            animation: abejaVuela 1.1s forwards;
        }

        @keyframes lluviaCae {
            0% { top: -20px; opacity: 0.9; }
            100% { top: 100%; opacity: 0; }
        }
        .rain-drop {
            position: absolute;
            font-size: 1.6rem;
            pointer-events: none;
            animation: lluviaCae 0.9s linear forwards;
            z-index: 170;
        }

        .global-bright {
            animation: allBright 0.55s ease 2;
        }
        @keyframes allBright {
            0% { filter: brightness(1); }
            50% { filter: brightness(1.35) drop-shadow(0 0 12px gold);}
            100% { filter: brightness(1); }
        }

        .congrats-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffcf4a;
            color: #2c5e2a;
            font-size: 1.9rem;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 80px;
            box-shadow: 0 0 0 6px white, 0 12px 28px black;
            z-index: 1000;
            animation: slideUp 0.3s, fadeOut 0.5s 3.2s forwards;
            display: flex;
            gap: 18px;
            align-items: center;
            white-space: nowrap;
        }
        @keyframes slideUp {
            from { opacity: 0; bottom: 0; }
            to { opacity: 1; bottom: 40px; }
        }
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        .parte-planta:focus-visible {
            outline: 4px solid #005fcc;
            outline-offset: 3px;
        }

        /* Responsive: en móviles, la info va arriba */
        @media (max-width: 820px) {
            .contenedor-principal {
                flex-direction: column;
            }
            .columna-info {
                max-width: 100%;
                min-width: 0;
                order: -1; /* La info aparece arriba en móviles */
            }
            .info-box {
                max-width: 100%;
            }
        }

        @media (max-width: 680px) {
            .parte-gigante { font-size: 1.8rem; padding: 8px 16px; }
            .funcion-texto { font-size: 1rem; padding: 6px 14px; }
            .emoji-grande { width: 55px; height: 55px; font-size: 2.2rem; }
            h1 { font-size: 1.6rem; }
            .header-ucv .logo-ucv { font-size: 1.2rem; }
            .header-ucv .facultad { font-size: 0.8rem; }
            .info-box { padding: 12px 16px; }
            .info-box .titulo-info { font-size: 1.1rem; }
            .columna-info { order: -1; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- ENCABEZADO UCV -->
    <div class="header-ucv">
        <div class="logo-ucv">🏛️ UNIVERSIDAD CÉSAR VALLEJO</div>
        <div class="facultad">🎓 FACULTAD DE EDUCACIÓN · <span>EDUCACIÓN PRIMARIA</span></div>
    </div>

    <h1>🌻 Partes de la Planta 🌿</h1>
    <div class="subtitulo">✨ Toca el TALLO, RAÍZ, HOJA o FLOR (toda la zona es interactiva) ✨</div>

    <!-- CONTENEDOR PRINCIPAL: planta + info al costado -->
    <div class="contenedor-principal">
        <!-- Columna izquierda: planta y panel de respuesta -->
        <div class="columna-planta">
            <div class="planta-mural" id="plantaMural">
                <div class="svg-plant-wrapper">
                    <svg viewBox="0 0 600 560" xmlns="http://www.w3.org/2000/svg" id="plantaSVG">
                        <!-- Maceta -->
                        <path d="M190 490 L410 490 L430 550 L170 550 Z" fill="#C27E42" stroke="#8B5A2B" stroke-width="3" />
                        <rect x="180" y="475" width="240" height="20" fill="#8B5A2B" rx="9" />
                        <ellipse cx="300" cy="480" rx="110" ry="13" fill="#6B3E1C" />
                        
                        <!-- RAÍCES MEJORADAS -->
                        <path d="M255 478 Q235 500 220 525 Q210 535 195 540" stroke="#D4865C" stroke-width="8" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath1" />
                        <path d="M275 476 Q268 505 260 530 Q255 542 248 548" stroke="#E0956A" stroke-width="7" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath2" />
                        <path d="M295 476 Q298 500 305 525 Q310 540 315 548" stroke="#D4865C" stroke-width="8" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath3" />
                        <path d="M320 476 Q335 498 345 520 Q355 535 365 542" stroke="#E0956A" stroke-width="7" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath4" />
                        <path d="M340 478 Q355 500 365 520 Q375 530 385 535" stroke="#D4865C" stroke-width="8" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath5" />
                        <path d="M268 505 Q250 515 235 520" stroke="#E0956A" stroke-width="5" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath6" />
                        <path d="M330 500 Q345 510 360 515" stroke="#D4865C" stroke-width="5" fill="none" stroke-linecap="round" class="parte-planta" id="raizPath7" />
                        
                        <!-- TALLO -->
                        <path d="M300 470 L300 275" stroke="#2C7A2E" stroke-width="22" fill="none" stroke-linecap="round" class="parte-planta" id="talloPrincipal" />
                        <path d="M300 470 L300 275" stroke="#4CAF50" stroke-width="9" fill="none" stroke-linecap="round" />
                        
                        <!-- HOJAS -->
                        <g class="parte-planta" id="hojasGrupo">
                            <path d="M288 360 Q210 310 190 345 Q235 390 288 360" fill="#6C9E2F" stroke="#3E6B1F" stroke-width="2.5" />
                            <path d="M285 355 Q240 335 195 345" stroke="#2E5A1E" stroke-width="1.8" fill="none" />
                            <path d="M312 395 Q375 345 410 375 Q370 415 312 395" fill="#558B2F" stroke="#2E5A1E" stroke-width="2.5" />
                            <path d="M315 392 Q360 370 405 378" stroke="#2E5A1E" stroke-width="1.8" fill="none" />
                            <path d="M310 310 Q355 280 380 300 Q350 325 310 310" fill="#6B8E23" stroke="#3E6B1F" stroke-width="2" />
                        </g>
                        
                        <!-- FLOR -->
                        <g class="parte-planta" id="florGrupo">
                            <circle cx="300" cy="245" r="24" fill="#FFD966" stroke="#E6A017" stroke-width="2" />
                            <circle cx="270" cy="228" r="22" fill="#FFB347" stroke="#E69500" stroke-width="2" />
                            <circle cx="330" cy="228" r="22" fill="#FFB347" stroke="#E69500" stroke-width="2" />
                            <circle cx="283" cy="265" r="22" fill="#FFA559" stroke="#E67E22" stroke-width="2" />
                            <circle cx="317" cy="265" r="22" fill="#FFA559" stroke="#E67E22" stroke-width="2" />
                            <circle cx="300" cy="215" r="22" fill="#FFC107" stroke="#E6A017" stroke-width="2" />
                            <circle cx="262" cy="248" r="20" fill="#FFB347" stroke="#E67E22" />
                            <circle cx="338" cy="248" r="20" fill="#FFB347" stroke="#E67E22" />
                            <circle cx="300" cy="245" r="19" fill="#F4A261" stroke="#B96F0F" stroke-width="2" />
                            <circle cx="300" cy="245" r="8" fill="#E9C46A" />
                        </g>
                        <text x="455" y="75" font-size="14" fill="#9B4E1F" font-weight="bold">🌻 ¡toca cualquier zona! 🌻</text>
                    </svg>
                </div>
            </div>

            <!-- PANEL DE RESPUESTA -->
            <div class="respuesta-panel" id="respuestaPanel">
                <div class="emoji-grande" id="emojiParte">🌱</div>
                <div>
                    <div class="parte-gigante" id="nombreParteGrande">🌿 PLANTA 🌿</div>
                    <div class="funcion-texto" id="textoFuncion">Toca cualquier parte de la planta</div>
                </div>
            </div>

            <!-- Barra de progreso -->
            <div class="progress-area">
                <div class="progress-header">
                    <span>🔬 Descubrimiento</span>
                    <span id="contadorProgreso">0/4</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill" id="barraFill"></div>
                </div>
            </div>

            <button class="water-button" id="regarBtn">💧 ¡Regar Planta! 🌈</button>
        </div>

        <!-- Columna derecha: RECUADRO INFORMATIVO (al costado) -->
        <div class="columna-info">
            <div class="info-box" id="infoBox">
                <div class="titulo-info">
                    <span class="icono-info" id="infoIcono">📖</span>
                    <span id="infoTitulo">Características</span>
                </div>
                <div id="infoContenido"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ========== DATOS DE CADA PARTE ==========
    const partesInfo = {
        raiz: {
            nombre: "🌱 RAÍZ",
            texto: "¡Absorbe agua y fija la planta a la tierra!",
            emoji: "💧🌱",
            descubierto: false,
            animacion: animarRaiz,
            sonido: "click-raiz",
            info: {
                icono: "🌱",
                titulo: "🌱 La RAÍZ",
                preguntas: [
                    { q: "❓ ¿Para qué sirve la raíz?", r: "La raíz sirve para absorber agua y minerales del suelo. También sujeta la planta para que no se caiga." },
                    { q: "❓ ¿Dónde está la raíz?", r: "La raíz está debajo de la tierra, dentro de la maceta." },
                    { q: "❓ ¿Cómo es la raíz?", r: "Tiene forma de hilos o ramas que se extienden bajo el suelo." }
                ],
                utilidad: "💡 La raíz es como la 'boca' de la planta, porque por ahí toma su alimento del suelo."
            }
        },
        tallo: {
            nombre: "🌿 TALLO",
            texto: "¡Transporta agua y nutrientes por toda la planta!",
            emoji: "💚🌿",
            descubierto: false,
            animacion: animarTallo,
            sonido: "click-tallo",
            info: {
                icono: "🌿",
                titulo: "🌿 El TALLO",
                preguntas: [
                    { q: "❓ ¿Para qué sirve el tallo?", r: "El tallo transporta agua y nutrientes desde la raíz hasta las hojas y la flor." },
                    { q: "❓ ¿Dónde está el tallo?", r: "El tallo está entre la raíz y las hojas, es la parte que sostiene a la planta." },
                    { q: "❓ ¿Cómo es el tallo?", r: "Es una vara verde que crece hacia arriba y da soporte a la planta." }
                ],
                utilidad: "💡 El tallo es como una 'tubería' que lleva el alimento a todas las partes de la planta."
            }
        },
        hoja: {
            nombre: "🍃 HOJA",
            texto: "¡Respira y fabrica alimento con la luz del sol!",
            emoji: "☀️🍃",
            descubierto: false,
            animacion: animarHoja,
            sonido: "click-hoja",
            info: {
                icono: "🍃",
                titulo: "🍃 La HOJA",
                preguntas: [
                    { q: "❓ ¿Para qué sirven las hojas?", r: "Las hojas fabrican el alimento de la planta usando la luz del sol, el agua y el aire." },
                    { q: "❓ ¿Dónde están las hojas?", r: "Las hojas crecen en el tallo, generalmente en forma de 'alas' verdes." },
                    { q: "❓ ¿Cómo son las hojas?", r: "Son planas y verdes. Pueden tener diferentes formas: alargadas, redondas, con bordes lisos o dentados." }
                ],
                utilidad: "💡 La hoja es como una 'fábrica de comida' que usa la luz del sol para hacer el alimento de la planta."
            }
        },
        flor: {
            nombre: "🌸 FLOR",
            texto: "¡Se encarga de la reproducción y da frutos!",
            emoji: "🐝🌸",
            descubierto: false,
            animacion: animarFlor,
            sonido: "click-flor",
            info: {
                icono: "🌸",
                titulo: "🌸 La FLOR",
                preguntas: [
                    { q: "❓ ¿Para qué sirve la flor?", r: "La flor sirve para que la planta pueda reproducirse y formar semillas y frutos." },
                    { q: "❓ ¿Dónde está la flor?", r: "La flor está en la parte más alta de la planta, en la punta del tallo." },
                    { q: "❓ ¿Cómo es la flor?", r: "Es colorida y tiene pétalos. Atrae a los insectos como las abejas y mariposas." }
                ],
                utilidad: "💡 La flor es como el 'corazón' de la planta, porque de ella nacen los frutos y las semillas."
            }
        }
    };

    // ========== VARIABLES GLOBALES ==========
    let totalDescubiertas = 0;
    let timeoutMensaje;
    let timeoutInfo;
    const nombreGrandeElem = document.getElementById('nombreParteGrande');
    const textoFuncionElem = document.getElementById('textoFuncion');
    const emojiParteElem = document.getElementById('emojiParte');
    const contadorSpan = document.getElementById('contadorProgreso');
    const barraFill = document.getElementById('barraFill');
    const muralDiv = document.getElementById('plantaMural');
    const infoBox = document.getElementById('infoBox');
    const infoIcono = document.getElementById('infoIcono');
    const infoTitulo = document.getElementById('infoTitulo');
    const infoContenido = document.getElementById('infoContenido');
    let celebrado = false;

    // ========== AUDIO (sonidos) ==========
    function reproducirSonido(parteKey) {
        try {
            const parte = partesInfo[parteKey];
            if (!parte) return;
            
            // Usar Web Audio API para generar sonidos simples
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            // Frecuencias diferentes para cada parte
            let frecuencia = 440; // La (nota)
            let duracion = 0.2;
            
            switch(parteKey) {
                case 'raiz':
                    frecuencia = 330; // Mi
                    break;
                case 'tallo':
                    frecuencia = 440; // La
                    break;
                case 'hoja':
                    frecuencia = 554; // Do#
                    break;
                case 'flor':
                    frecuencia = 659; // Mi
                    break;
                default:
                    frecuencia = 440;
            }
            
            oscillator.frequency.value = frecuencia;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duracion);
            
            // Pequeño efecto de "clic" adicional
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.frequency.value = frecuencia * 1.5;
            osc2.type = 'sine';
            gain2.gain.setValueAtTime(0.1, audioCtx.currentTime + 0.02);
            gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion + 0.05);
            osc2.start(audioCtx.currentTime + 0.02);
            osc2.stop(audioCtx.currentTime + duracion + 0.05);
            
        } catch(e) {
            // Si falla el audio, simplemente no suena
            console.log('Audio no disponible');
        }
    }

    // ========== FUNCIONES PRINCIPALES ==========
    function actualizarProgreso() {
        const porcentaje = (totalDescubiertas / 4) * 100;
        barraFill.style.width = `${porcentaje}%`;
        barraFill.textContent = totalDescubiertas === 4 ? "🏆 COMPLETO 🏆" : "";
        contadorSpan.innerText = `${totalDescubiertas}/4`;
        
        if (totalDescubiertas === 4 && !celebrado) {
            celebrado = true;
            mostrarFelicidades();
        } else if (totalDescubiertas !== 4) {
            celebrado = false;
        }
    }

    function mostrarFelicidades() {
        const toast = document.createElement('div');
        toast.className = 'congrats-toast';
        toast.innerHTML = '🌟✨ ¡Felicidades, eres un gran Científico! ✨🌟';
        document.body.appendChild(toast);
        document.querySelector('.app-container').classList.add('global-bright');
        setTimeout(() => document.querySelector('.app-container').classList.remove('global-bright'), 700);
        setTimeout(() => toast.remove(), 3800);
    }

    function mostrarInfo(parteKey) {
        const parte = partesInfo[parteKey];
        if (!parte || !parte.info) return;
        
        const info = parte.info;
        infoIcono.textContent = info.icono;
        infoTitulo.textContent = info.titulo;
        
        let html = '';
        info.preguntas.forEach(p => {
            html += `<div class="pregunta">${p.q}</div>`;
            html += `<div class="respuesta">${p.r}</div>`;
        });
        html += `<div class="utilidad"><strong>💡 Dato importante:</strong> ${info.utilidad}</div>`;
        infoContenido.innerHTML = html;
        
        infoBox.classList.add('mostrar');
        
        if (timeoutInfo) clearTimeout(timeoutInfo);
        timeoutInfo = setTimeout(() => {
            infoBox.classList.remove('mostrar');
        }, 9000);
    }

    function tocarParte(parteKey) {
        const parte = partesInfo[parteKey];
        if (!parte) return;
        
        // Reproducir sonido
        reproducirSonido(parteKey);
        
        if (!parte.descubierto) {
            parte.descubierto = true;
            totalDescubiertas++;
            actualizarProgreso();
        }
        
        if (timeoutMensaje) clearTimeout(timeoutMensaje);
        
        nombreGrandeElem.innerHTML = parte.nombre;
        textoFuncionElem.innerHTML = parte.texto;
        emojiParteElem.innerHTML = parte.emoji;
        
        const panel = document.getElementById('respuestaPanel');
        panel.style.transform = 'scale(1.02)';
        panel.style.transition = '0.1s';
        setTimeout(() => panel.style.transform = 'scale(1)', 150);
        
        if (parte.animacion && typeof parte.animacion === 'function') {
            parte.animacion();
        }
        
        resaltarParteSVG(parteKey);
        mostrarInfo(parteKey);
        
        timeoutMensaje = setTimeout(() => {
            if (totalDescubiertas < 4) {
                nombreGrandeElem.innerHTML = "🌿 EXPLORA 🌿";
                textoFuncionElem.innerHTML = "¡Toca cualquier parte de la planta!";
                emojiParteElem.innerHTML = "🌱";
            } else {
                nombreGrandeElem.innerHTML = "🏆 CIENTÍFICO 🏆";
                textoFuncionElem.innerHTML = "¡Descubriste todas las partes! ¡Eres genial!";
                emojiParteElem.innerHTML = "🌟";
            }
        }, 5000);
    }
    
    function resaltarParteSVG(parteKey) {
        let selectores = [];
        if (parteKey === 'raiz') selectores = ['#raizPath1', '#raizPath2', '#raizPath3', '#raizPath4', '#raizPath5', '#raizPath6', '#raizPath7'];
        if (parteKey === 'tallo') selectores = ['#talloPrincipal'];
        if (parteKey === 'hoja') selectores = ['#hojasGrupo'];
        if (parteKey === 'flor') selectores = ['#florGrupo'];
        selectores.forEach(sel => {
            const elem = document.querySelector(sel);
            if (elem) {
                elem.classList.add('highlight-part');
                setTimeout(() => elem.classList.remove('highlight-part'), 500);
            }
        });
    }

    // ========== ANIMACIONES VISUALES ==========
    function animarRaiz() {
        for(let i=0; i<14; i++) {
            const gota = document.createElement('div');
            gota.className = 'drop-animation';
            gota.innerText = '💧';
            const offsetX = 40 + Math.random() * 230;
            gota.style.left = `${offsetX}px`;
            gota.style.bottom = '20px';
            gota.style.position = 'absolute';
            muralDiv.style.position = 'relative';
            muralDiv.appendChild(gota);
            setTimeout(() => gota.remove(), 950);
        }
    }

    function animarTallo() {
        const talloSvg = document.getElementById('talloPrincipal');
        talloSvg.classList.add('tallo-glint');
        setTimeout(() => talloSvg.classList.remove('tallo-glint'), 600);
        for(let i=0;i<7;i++) {
            const burbuja = document.createElement('div');
            burbuja.innerText = '💧';
            burbuja.className = 'drop-animation';
            burbuja.style.left = `${285 + Math.random() * 30}px`;
            burbuja.style.bottom = '150px';
            burbuja.style.fontSize = '1.3rem';
            muralDiv.appendChild(burbuja);
            setTimeout(() => burbuja.remove(), 800);
        }
    }

    function animarHoja() {
        const sol = document.createElement('div');
        sol.className = 'sun-flash';
        sol.innerText = '☀️✨';
        muralDiv.appendChild(sol);
        setTimeout(() => sol.remove(), 900);
        const hojasGroup = document.getElementById('hojasGrupo');
        hojasGroup.classList.add('hoja-wobble');
        setTimeout(() => hojasGroup.classList.remove('hoja-wobble'), 550);
    }

    function animarFlor() {
        const florGroup = document.getElementById('florGrupo');
        florGroup.classList.add('flor-bloom');
        setTimeout(() => florGroup.classList.remove('flor-bloom'), 700);
        const abeja = document.createElement('div');
        abeja.className = 'bee-fly';
        abeja.innerText = '🐝🌸';
        const florRect = florGroup.getBoundingClientRect();
        const contRect = muralDiv.getBoundingClientRect();
        const leftRel = florRect.left + florRect.width/2 - contRect.left;
        const topRel = florRect.top - contRect.top;
        abeja.style.left = `${leftRel - 15}px`;
        abeja.style.top = `${topRel - 5}px`;
        muralDiv.appendChild(abeja);
        setTimeout(() => abeja.remove(), 1300);
        const mariposa = document.createElement('div');
        mariposa.className = 'bee-fly';
        mariposa.innerText = '🦋';
        mariposa.style.left = `${leftRel + 25}px`;
        mariposa.style.top = `${topRel - 5}px`;
        mariposa.style.animationDuration = '1s';
        muralDiv.appendChild(mariposa);
        setTimeout(() => mariposa.remove(), 1200);
    }

    // ========== EVENTOS ==========
    function conectarEventos() {
        const raices = ['raizPath1', 'raizPath2', 'raizPath3', 'raizPath4', 'raizPath5', 'raizPath6', 'raizPath7'];
        raices.forEach(id => {
            const elem = document.getElementById(id);
            if (elem) {
                elem.addEventListener('click', (e) => { e.stopPropagation(); tocarParte('raiz'); });
                elem.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarParte('raiz'); } });
                elem.setAttribute('tabindex', '0');
                elem.setAttribute('aria-label', 'Raíz de la planta');
            }
        });
        
        const tallo = document.getElementById('talloPrincipal');
        if (tallo) {
            tallo.addEventListener('click', (e) => { e.stopPropagation(); tocarParte('tallo'); });
            tallo.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarParte('tallo'); } });
            tallo.setAttribute('tabindex', '0');
        }
        
        const hojas = document.getElementById('hojasGrupo');
        if (hojas) {
            hojas.addEventListener('click', (e) => { e.stopPropagation(); tocarParte('hoja'); });
            hojas.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarParte('hoja'); } });
            hojas.setAttribute('tabindex', '0');
        }
        
        const flor = document.getElementById('florGrupo');
        if (flor) {
            flor.addEventListener('click', (e) => { e.stopPropagation(); tocarParte('flor'); });
            flor.addEventListener('keypress', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tocarParte('flor'); } });
            flor.setAttribute('tabindex', '0');
        }
    }

    const regarBtn = document.getElementById('regarBtn');
    regarBtn.addEventListener('click', () => {
        // Sonido de riego
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 600;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.3);
            
            // Segundo sonido de gota
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.frequency.value = 800;
                osc2.type = 'sine';
                gain2.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc2.start(audioCtx.currentTime);
                osc2.stop(audioCtx.currentTime + 0.2);
            }, 150);
        } catch(e) {}
        
        for(let i=0; i<50; i++) {
            const lluvia = document.createElement('div');
            lluvia.className = 'rain-drop';
            lluvia.innerText = '💧';
            lluvia.style.left = `${Math.random() * 100}%`;
            lluvia.style.top = `-15px`;
            muralDiv.appendChild(lluvia);
            setTimeout(() => lluvia.remove(), 1000);
        }
        const todasPartes = document.querySelectorAll('.parte-planta');
        todasPartes.forEach(part => {
            part.classList.add('highlight-part');
            setTimeout(() => part.classList.remove('highlight-part'), 700);
        });
        if (timeoutMensaje) clearTimeout(timeoutMensaje);
        nombreGrandeElem.innerHTML = "💧 RIEGO 💧";
        textoFuncionElem.innerHTML = "¡La planta recibe agua y crece feliz! 🌱";
        emojiParteElem.innerHTML = "💦🌿";
        const panel = document.getElementById('respuestaPanel');
        panel.style.transform = 'scale(1.02)';
        setTimeout(() => panel.style.transform = 'scale(1)', 150);
        infoBox.classList.remove('mostrar');
        if (timeoutInfo) clearTimeout(timeoutInfo);
        timeoutMensaje = setTimeout(() => {
            if (totalDescubiertas < 4) {
                nombreGrandeElem.innerHTML = "🌿 EXPLORA 🌿";
                textoFuncionElem.innerHTML = "¡Toca cualquier parte de la planta!";
                emojiParteElem.innerHTML = "🌱";
            } else {
                nombreGrandeElem.innerHTML = "🏆 CIENTÍFICO 🏆";
                textoFuncionElem.innerHTML = "¡Descubriste todas las partes! ¡Eres genial!";
                emojiParteElem.innerHTML = "🌟";
            }
        }, 4000);
    });

    conectarEventos();
    nombreGrandeElem.innerHTML = "🌿 PLANTA 🌿";
    textoFuncionElem.innerHTML = "Toca el TALLO, RAÍZ, HOJA o FLOR";
    emojiParteElem.innerHTML = "🌱";
</script>
</body>
</html>
